<script>
'use strict';
// MOBILE — pełny ekran, blokada orientacji poziomej, wibracje, praca offline.
// Wszystko opcjonalne: brak API (np. iOS Safari) nigdy nie blokuje gry.
const IS_TOUCH=matchMedia('(pointer:coarse)').matches;
function goFullscreen(){
  const el=document.documentElement;
  if(document.fullscreenElement||!IS_TOUCH)return;
  const req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(req){try{const p=req.call(el,{navigationUI:'hide'});if(p&&p.catch)p.catch(()=>{});}catch{}}
}
function lockLandscape(){
  try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch{}
}
document.addEventListener('fullscreenchange',()=>{if(document.fullscreenElement)lockLandscape();});
function vibrate(pattern){try{if(IS_TOUCH&&navigator.vibrate)navigator.vibrate(pattern);}catch{}}
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
// Stała blokada w trybie standalone (PWA/Capacitor) — bez fullscreen API iOS nadal użyje meta apple-mobile-web-app-capable.
lockLandscape();
// CONFIG POZIOMÓW — target: cel piątek; prędkości w pikselach logicznych/s.
// exam: udział sprawdzianów wśród jedynek; interval: odstęp spawnu w sekundach.
const BASE_LEVELS = [
  {target:12, time:35, speed:168, interval:0.8925, good:0.60, diagonal:0,    exam:0,    brightness:1},
  {target:16, time:40, speed:246, interval:0.7225, good:0.50, diagonal:0.35, exam:0,    brightness:0.85},
  {target:16, time:60, speed:324, interval:0.5950, good:0.40, diagonal:0.70, exam:0.35, brightness:0.85},
  {target:20, time:55, speed:350, interval:1.0, good:1, diagonal:0.30, exam:0, brightness:0.80},
  {target:14, time:65, speed:0, interval:1.8, good:1, diagonal:0, exam:0, brightness:0.90}
];
// WYBÓR TRUDNOŚCI — normalny zachowuje dotychczasowy balans.
const DIFFICULTIES=[
  {name:'Łatwy',key:'easy',targets:[8,12,12,14,10],times:[50,60,75,70,65],speed:0.8,interval:1.1,good:0.10,series:1},
  {name:'Normalny',key:'normal',targets:[12,16,16,20,14],times:[35,40,60,55,65],speed:1,interval:1,good:0,series:2},
  {name:'Trudny',key:'hard',targets:[14,18,20,24,18],times:[35,40,50,50,60],speed:1.1,interval:0.9,good:0,series:3}
];
let difficulty=1;
let LEVELS=BASE_LEVELS.map(x=>({...x}));
const sessionBests=[0,0,0];
function recordKey(){return 'ruszkowski-five-action-v2-'+DIFFICULTIES[difficulty].key;}
function applyDifficulty(){
  const d=DIFFICULTIES[difficulty];
  LEVELS=BASE_LEVELS.slice(0,d.targets.length).map((x,i)=>({...x,target:d.targets[i],time:d.times[i],
    speed:x.speed*d.speed,interval:x.interval*d.interval,good:Math.min(1,x.good+d.good)}));
  best=readBest();
}
const W=1280, H=720, FLOOR=H*0.85, PLAYER_H=H*0.22;
const BOOST_TIME=3, BOOST_EVERY=20, BOOST_FIRST=9, MAGNET=150;
const EXAM_WARNING=0.7, INVULNERABLE=0.8;
// Nowa wersja punktacji ma osobny rekord; brak dostępu do zapisu nie blokuje gry.
// Każdy tryb ma osobny rekord, również gdy zapis jest zablokowany.
function readBest(){
  try{const n=Number(localStorage.getItem(recordKey()));return Math.max(sessionBests[difficulty],Number.isSafeInteger(n)&&n>=0?n:0);}catch{return sessionBests[difficulty];}
}
function saveBest(){sessionBests[difficulty]=best;try{localStorage.setItem(recordKey(),String(best));}catch{}}
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
let dpr=1;
function resize(){
  const box=canvas.getBoundingClientRect();
  dpr=window.devicePixelRatio||1;
  canvas.width=Math.max(1,Math.round(box.width*dpr));
  canvas.height=Math.max(1,Math.round(box.height*dpr));
}
window.addEventListener('resize',resize); resize();
// Po obrocie / wejściu w pełny ekran przeglądarki mobilne zgłaszają wymiary z opóźnieniem.
for(const ev of ['orientationchange','fullscreenchange'])window.addEventListener(ev,()=>{resize();setTimeout(resize,250);});

// ASSETS — brak obrazu nigdy nie blokuje startu gry.
const assets={};
// GitHub Pages rozróżnia wielkość liter. Najpierw sprawdzamy nazwę docelową,
// potem typowe warianty eksportu — bez fetch, również dla file://.
const assetFiles={
  damian:['damian.png','damian.png.png','Damian.png','damian.PNG'],
  uczen:['uczen.png','uczen.png.png','Uczen.png','uczen.PNG','uczeń.png','Uczeń.png'],
  uczennica:['uczennica.png','uczennica.png.png','Uczennica.png','uczennica.PNG'],
  logo:['logo.png','logo.png.png','Logo.png','logo.PNG','Logo.PNG'],
  pand:['pan-d.png','pan_d.png','pand.png','lukasz.png'],
  bg:['bg.png','bg.png.png','Bg.png','bg.PNG']
};
for(const [name,files] of Object.entries(assetFiles)){
  const paths=['assets','Assets'].flatMap(folder=>files.map(file=>'./'+folder+'/'+file));
  const img=new Image();assets[name]=img;
  let attempt=0;
  img.onerror=()=>{
    if(attempt<paths.length)img.src=paths[attempt++];
    else console.warn('Nie znaleziono grafiki '+name+'. Sprawdź pliki w assets/.');
  };
  img.onload=()=>{img.onerror=null;};
  img.src=paths[attempt++];
}
function ready(img){return img&&img.complete&&img.naturalWidth>0;}
function picture(name,x,y,w,h){
  const img=assets[name];
  if(ready(img)){ctx.drawImage(img,x,y,w,h);return;}
  ctx.fillStyle=name==='uczen'?'#8392a7':name==='uczennica'?'#b0788c':'#345079';
  ctx.fillRect(x,y,w,h); text(name,x+w/2,y+h/2,18);
}
function logo(x,y,h){
  const im=assets.logo, w=h*(ready(im)?im.naturalWidth/im.naturalHeight:0.8125);
  picture('logo',x-w/2,y,w,h);
}

// STAN GRY — checkpoint cofa punkty nieudanej próby, zapobiegając farmieniu.
let state='title',level=0,selected=0,score=0,best=readBest(),checkpoint=0;
// WYBÓR POSTACI — uczeń lub uczennica w klasach 1–4 i jako kibic w finale.
let hero='uczen';
try{if(localStorage.getItem('ruszkowski-hero')==='uczennica')hero='uczennica';}catch{}
function setHero(h){hero=h;try{localStorage.setItem('ruszkowski-hero',h);}catch{}}
function fem(){return hero==='uczennica';}
function heroLabel(){return fem()?'UCZENNICA':'UCZEŃ';}
let fives=0,ones=0,elapsed=0,spawnIn=0.8,boostIn=BOOST_EVERY,boost=0;
let items=[],sparks=[],shake=0,clock=0,paused=false,menuAge=0;
let examQueue=0,examIn=0,failure='';
let combo=0,invulnerable=0,retried=false,notice='',noticeTime=0;
function announce(message){notice=message;noticeTime=2.5;}
const player={x:W/2,dir:1,moving:false,red:0,green:0,knock:0};
function clearInput(){keys.clear();pointers.clear();firePointers.clear();player.moving=false;}
function menu(next){state=next;menuAge=0;clearInput();}
function startLevel(){
  score=checkpoint;fives=0;ones=0;elapsed=0;boost=0;
  examQueue=0;examIn=0;failure='';
  combo=0;invulnerable=0;notice='';noticeTime=0;
  spawnIn=0.8;boostIn=BOOST_FIRST;items=[];sparks=[];shake=0;
  Object.assign(player,{x:W/2,dir:1,moving:false,red:0,green:0,knock:0});
  selected=level===4?1:0;
  resetTeacher();resetFinal();resetBoss();
  paused=false;clearInput();state='play';
}
function newGame(){applyDifficulty();retried=false;level=0;selected=0;checkpoint=0;startLevel();}
function advance(){
  if(menuAge<0.2)return;
  if(state==='title'||state==='win')menu('difficulty');
  else if(state==='difficulty')menu('character');
  else if(state==='character')newGame();
  else if(state==='repeat'){retried=true;startLevel();}
  else if(state==='promotion'){level++;retried=false;checkpoint=score;menu('briefing');}
  else if(state==='briefing')startLevel();
}
function failLevel(reason){failure=reason;sound('sad');vibrate([120,80,200]);menu('repeat');}
function finishLevel(){
  if(ones===0)score+=500;
  sound('fanfare');vibrate([40,40,40,40,90]);
  if(level===LEVELS.length-1){best=Math.max(best,score);saveBest();menu('win');}
  else menu('promotion');
}
function togglePause(){if(state==='play'){paused=!paused;clearInput();}}

// INPUT — Pointer Events obsługują także kilka palców naraz.
const keys=new Set(),pointers=new Map(),firePointers=new Set();
const fireBox={x:1010,y:632,w:250,h:74};
function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function inside(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
const muteBox={x:1190,y:14,w:72,h:54},pauseBox={x:1105,y:14,w:72,h:54};
const difficultyCards=[{x:115,y:260,w:330,h:270},{x:475,y:260,w:330,h:270},{x:835,y:260,w:330,h:270}];
const characterCards=[{x:270,y:190,w:320,h:360},{x:690,y:190,w:320,h:360}];
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowleft','arrowright','a','d','enter','p','r','m',' '].includes(k))e.preventDefault();
  unlockAudio();
  if(e.repeat)return;
  keys.add(k);
  if(k==='m')muted=!muted;
  if(k==='p')togglePause();
  if(k==='r'&&state==='play'){retried=true;startLevel();}
  if(state==='difficulty'&&['arrowleft','a','arrowright','d'].includes(k)){
    difficulty=Math.max(0,Math.min(2,difficulty+(['arrowleft','a'].includes(k)?-1:1)));
  }
  if(state==='character'&&['arrowleft','a','arrowright','d'].includes(k))setHero(['arrowleft','a'].includes(k)?'uczen':'uczennica');
  if(k==='enter'){if(paused)togglePause();else advance();}
});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();unlockAudio();goFullscreen();const p=point(e);
  if(inside(p,muteBox)){muted=!muted;return;}
  if(state==='play'){
    if(inside(p,pauseBox)||paused){togglePause();return;}
    if(level===4&&inside(p,fireBox))firePointers.add(e.pointerId);
    else pointers.set(e.pointerId,p.x<W/2?-1:1);
    try{canvas.setPointerCapture(e.pointerId);}catch{}
  }else if(state==='difficulty'){
    if(menuAge<0.2)return;
    const i=difficultyCards.findIndex(r=>inside(p,r));
    if(i>=0)difficulty=i;
    advance();
  }else if(state==='character'){
    if(menuAge<0.2)return;
    const i=characterCards.findIndex(r=>inside(p,r));
    if(i>=0)setHero(i?'uczennica':'uczen');
    advance();
  }else advance();
});
canvas.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId))pointers.set(e.pointerId,point(e).x<W/2?-1:1);
});
for(const event of ['pointerup','pointercancel','lostpointercapture'])
  canvas.addEventListener(event,e=>{pointers.delete(e.pointerId);firePointers.delete(e.pointerId);});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('blur',()=>{clearInput();if(state==='play')paused=true;});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInput();if(state==='play')paused=true;}});

// AUDIO — synteza bez plików; odblokowanie dopiero po geście użytkownika.
let audio=null,muted=false;
function unlockAudio(){
  try{
    if(!audio){const Audio=window.AudioContext||window.webkitAudioContext;if(Audio)audio=new Audio();}
    if(audio&&audio.state==='suspended')audio.resume().catch(()=>{});
  }catch{}
}
function tone(freq,delay,duration,type='sine',end=freq){
  if(!audio||muted||audio.state!=='running')return;
  try{
    const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);
    o.frequency.exponentialRampToValueAtTime(end,t+duration);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.10,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+duration);
    o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+duration+0.02);
  }catch{}
}
function sound(kind){
  if(kind==='ding'){tone(880,0,0.15);tone(1320,0.08,0.22);}
  if(kind==='throw')tone(420,0,0.14,'triangle',110);
  if(kind==='buzz')tone(150,0,0.25,'sawtooth',65);
  if(kind==='clang'){tone(1600,0,0.16,'triangle',600);tone(2230,0,0.10);}
  if(kind==='fanfare')[523,659,784,1047].forEach((f,i)=>tone(f,i*0.12,0.25,'triangle'));
  if(kind==='sad')[392,370,330,196].forEach((f,i)=>tone(f,i*0.18,0.30,'sawtooth',f*0.9));
  if(kind==='powerup')[440,660,880,1320].forEach((f,i)=>tone(f,i*0.08,0.2));
}

function smooth(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);}
// Faza pojedynku zależy od paska Łukasza: 0 spokojna, 1 serie, 2 furia.
function duelPhase(){if(level!==4)return 0;const r=boss.hp/boss.maxHp;return r>0.6?0:r>0.3?1:2;}
function bossPose(){
 const t=boss.active?boss.t:0;
 let a=0,lean=0;
 // Wariant zamachu: 'arc' rzuca znad głowy (ręka wyżej), 'flat' płasko (ręka niżej).
 const v=boss.plan[boss.shots]||'normal',hi=v==='arc'||v==='examArc'?1.55:v==='flat'?0.7:1;
 if(boss.defeated){a=-0.35;lean=0.45;}
 else if(boss.active){
  if(t<0.42){a=0.13*hi*smooth(t/0.42);lean=0.055*smooth(t/0.42);}
  else if(t<0.56){const p=smooth((t-0.42)/0.14);a=0.13*hi-0.23*hi*p;lean=0.055-0.12*p;}
  else{const p=smooth((t-0.56)/0.46);a=-0.10*hi*(1-p);lean=-0.065*(1-p);}
 }
 lean+=boss.tilt;
 const walk=boss.moving&&!boss.active?Math.abs(Math.sin(clock*14))*4:0;
 return {a,lean,breathe:(boss.active?0:Math.sin(clock*3)*1.5)-walk};
}
function rotatePoint(x,y,px,py,a){
 const dx=x-px,dy=y-py;return {x:px+dx*Math.cos(a)-dy*Math.sin(a),y:py+dx*Math.sin(a)+dy*Math.cos(a)};
}
function bossScale(){return level===4&&duelPhase()===2?1.1:1;}
function bossHand(){
 const pose=bossPose(),k=bossScale();
 let p=rotatePoint(400,290,535,360,pose.a);
 p=rotatePoint(p.x,p.y,650,760,pose.lean);
 return {x:boss.x+boss.knock+boss.face*(p.x/1145-0.5)*boss.w*k,y:boss.feet-boss.h*k+p.y/1374*boss.h*k+pose.breathe};
}
function throwOne(){
 const hand=bossHand();

 let flight=[1.2,0.85,0.68][difficulty],gravity=440,kind='1';
 if(variant==='flat'){gravity=150;flight*=0.8;}
 if(variant==='arc'){gravity=950;flight*=1.3;}
 if(variant==='exam'){kind='exam';}
 if(variant==='examArc'){kind='exam';gravity=950;flight*=1.3;}
 if(variant==='trap'){kind='trap';gravity=Math.random()<0.5?150:950;flight*=gravity>500?1.3:0.8;}
 const offset=(boss.shots%2===0?-1:1)*(difficulty===2?55:35);
 const target=Math.max(80,Math.min(W-80,boss.aimX+offset));
 items.push({kind,x:hand.x,y:hand.y,vx:(target-hand.x)/flight,
  vy:(FLOOR-PLAYER_H/2-hand.y-0.5*gravity*flight*flight)/flight,
  gravity,phase:0,reflected:false,warning:0,thrown:true,age:0});
 boss.shots++;sound('throw');burst(hand.x,hand.y,kind==='trap'?'#8bff9d':'#ff7975');

// Plan serii w finale: faza 0 pojedynczy rzut, faza 1 serie ze sprawdzianem, faza 2 furia z pułapką i podwójnym rzutem.
function planSeries(){
 if(level!==4)return [];
 const ph=duelPhase(),n=Math.min(3,DIFFICULTIES[difficulty].series+(ph>0?1:0));
 boss.seriesCount++;
 const pick=()=>Math.random()<0.5?'flat':'arc';
 if(ph===0)return [boss.seriesCount%3===0?'exam':pick()];
 const out=[];for(let i=0;i<n;i++)out.push(pick());
 if(ph===1){
  if(Math.random()<0.15)out[0]='trap';
  if(difficulty===2||boss.seriesCount%2===0)out[out.length-1]='exam';
  return out;
 }
 for(let i=0;i<n;i++)if(Math.random()<0.35)out[i]='trap';
 if(boss.seriesCount%2===0){out[0]='flat';out[1]='examArc';out.double=true;}
 else out[out.length-1]='exam';
 return out;
}
function updateBoss(dt){
 boss.knock*=Math.exp(-9*dt);boss.tilt*=Math.exp(-7*dt);boss.flash=Math.max(0,boss.flash-dt);boss.sayT=Math.max(0,boss.sayT-dt);
 if(boss.defeated)return;
 const ph=duelPhase();
 if(!boss.active){
  boss.wait-=dt;
  const center=level===4&&ph===2?800:950;
  const destination=center+Math.sin(elapsed*0.7)*150;
  const step=Math.max(-100*dt,Math.min(100*dt,destination-boss.x));
  boss.x+=step;boss.moving=Math.abs(step)>0.2;
  boss.face=player.x<boss.x?1:-1;
  if(boss.wait<=0){boss.active=true;boss.moving=false;boss.t=0;boss.shots=0;boss.aimX=player.x;boss.plan=planSeries();}
  return;
 }
 boss.t+=dt*(difficulty===0?0.65:1)*(level===4&&ph===2?1.6:1);
 const count=level===4?boss.plan.length:DIFFICULTIES[difficulty].series;
 const gap=boss.plan.double?0.05:0.13;
 // Cel zostaje ustalony podczas zamachu. Jedynki nie śledzą gracza w locie.
 while(boss.shots<count&&boss.t>=0.52+boss.shots*gap)throwOne();
 if(boss.t>=1.04){boss.active=false;let wait=[1.1,0.32,0.10][difficulty];
  if(level===4)wait=ph===0?wait*1.5+1.0:ph===1?wait+0.7:wait*0.7+0.3;boss.wait=wait;}
}

function damianPose(t,active){
  if(!active)return 0;
  if(t<0.18)return -0.10*smooth(t/0.18);
  if(t<0.28)return -0.10+0.24*smooth((t-0.18)/0.10);
  return 0.14*(1-smooth((t-0.28)/0.22));
}
function damianHand(x,feet,h,dir,t,active){

function hitSegment(x1,y1,x2,y2,left,top,right,bottom){
  let near=0,far=1;
  for(const [a,b,lo,hi] of [[x1,x2,left,right],[y1,y2,top,bottom]]){
    const d=b-a;
    if(Math.abs(d)<1e-9){if(a<lo||a>hi)return false;continue;}
    let t0=(lo-a)/d,t1=(hi-a)/d;
    if(t0>t1)[t0,t1]=[t1,t0];near=Math.max(near,t0);far=Math.min(far,t1);
    if(near>far)return false;
  }
  return true;
}

function dropMarker(){fx.push({kind:'marker',x:player.x+player.dir*30,y:FLOOR-PLAYER_H*0.55,vx:-player.dir*180,vy:-330,rot:0,life:1.1,maxLife:1.1});}

    if(o.warning>0||o.reflected||(o.kind!=='1'&&o.kind!=='trap'))continue;
    const d=Math.hypot(o.x-player.x,o.y-(FLOOR-PLAYER_H*0.6));
    if(d<bestD){target=o;bestD=d;}

  return target;
}

  finalShot.cooldown=Math.max(0,finalShot.cooldown-dt);
  if(!finalShot.active&&finalShot.cooldown===0&&invulnerable<INVULNERABLE-0.45&&(keys.has(' ')||firePointers.size)){
    finalShot.active=true;finalShot.t=0;finalShot.released=false;
  }
  if(finalShot.active){
    finalShot.t+=dt;
    if(!finalShot.released&&finalShot.t>=0.24){
      const hand=damianHand(player.x,FLOOR,PLAYER_H,player.dir,finalShot.t,true);
      const target=aimTarget();
      const tx=target?target.x+target.vx*0.2:hand.x,ty=target?target.y+target.vy*0.2:hand.y-500;
      const dx=tx-hand.x,dy=ty-hand.y,length=Math.hypot(dx,dy)||1;
      friendly.push({x:hand.x,y:hand.y,oldX:hand.x,oldY:hand.y,vx:dx/length*720,vy:dy/length*720,target,trail:[]});
      burst(hand.x,hand.y,'#60e473');
      finalShot.released=true;sound('throw');
    }
    if(finalShot.t>=0.5){finalShot.active=false;finalShot.cooldown=[0.1,0.2,0.3][difficulty];}
  }
  const zone=DUEL.parry[difficulty];
  for(let i=friendly.length-1;i>=0;i--){
    const shot=friendly[i];shot.oldX=shot.x;shot.oldY=shot.y;
    shot.trail=shot.trail||[];shot.trail.unshift({x:shot.x,y:shot.y});shot.trail.length=Math.min(shot.trail.length,9);
    if(shot.target&&!shot.target.reflected&&items.includes(shot.target)){
      const dx=shot.target.x-shot.x,dy=shot.target.y-shot.y,length=Math.hypot(dx,dy)||1;
      const blend=1-Math.exp(-10*dt);
      shot.vx=shot.vx*(1-blend)+dx/length*720*blend;shot.vy=shot.vy*(1-blend)+dy/length*720*blend;
    }
    shot.x+=shot.vx*dt;shot.y+=shot.vy*dt;
    let used=false;
    for(let j=items.length-1;j>=0;j--){
      const o=items[j];if((o.kind!=='1'&&o.kind!=='trap')||o.reflected||o.warning>0)continue;
      // Ruch względny obu pocisków zapobiega przenikaniu przy małej liczbie FPS.
      const nextX=o.x+o.vx*dt,nextY=o.y+(o.vy+(o.gravity||0)*dt)*dt;
      if(hitSegment(shot.oldX-o.x,shot.oldY-o.y,shot.x-nextX,shot.y-nextY,-39,-44,39,44)){
        used=true;
        if(o.kind==='trap'){
          items.splice(j,1);boss.hp=Math.min(boss.maxHp,boss.hp+1);duel.streak=0;
          pop(o.x,o.y,'PUŁAPKA! Łukasz +1','#ff7975');sound('buzz');burst(o.x,o.y,'#ff7975');
          fanMood('sad',1.2);fanSay('TO BYŁA PUŁAPKA!',1.4);boss.say='Ha!';boss.sayT=1.2;
        }else if(Math.hypot(o.x-player.x,o.y-(FLOOR-PLAYER_H*0.6))<zone)parry(o);
        else{used=false;if(!shot.whiffed){shot.whiffed=true;pop(o.x,o.y-40,'ZA DALEKO','#c8d5e8');}continue;}
        break;
      }
    }
    if(used||shot.y<-40||shot.y>H+60||shot.x<-60||shot.x>W+60)friendly.splice(i,1);
    if(state!=='play')return;
  }
}

// PLAYER — fizyka niezależna od liczby klatek; hitbox to 60% sprite'a.
function playerWidth(){
  const img=assets[selected?'damian':hero];
  return PLAYER_H*(ready(img)?img.naturalWidth/img.naturalHeight:0.65);
}
function updatePlayer(dt){
  const left=keys.has('arrowleft')||keys.has('a')||[...pointers.values()].includes(-1);
  const right=keys.has('arrowright')||keys.has('d')||[...pointers.values()].includes(1);
  const dir=Number(right)-Number(left);
  player.moving=dir!==0;if(dir)player.dir=dir;
  player.x+=dir*470*dt+player.knock*dt;player.knock*=Math.exp(-12*dt);
  const half=playerWidth()/2;player.x=Math.max(half,Math.min(W-half,player.x));
  player.red=Math.max(0,player.red-dt);player.green=Math.max(0,player.green-dt);
}

// COLLISIONS — każdy obiekt jest rozliczany tylko raz.
function collides(o){
  const s=size(o),half=playerWidth()*.30;
  return o.x+s.w/2>player.x-half&&o.x-s.w/2<player.x+half&&
    o.y+s.h/2>FLOOR-PLAYER_H&&o.y-s.h/2<FLOOR;
}
function collect(o){
  if(o.kind==='logo'){boost=level===4?2:BOOST_TIME;sound('powerup');vibrate(30);burst(player.x,FLOOR-80,'#ffda62');return;}
  if(level===4){
    // Finał: obrażenia zamiast liczenia jedynek; piątka-życie od kibica leczy.
    if(o.kind==='5'){if(o.life){duel.playerHp=Math.min(duel.maxHp,duel.playerHp+1);duel.hitStreak=0;pop(player.x,FLOOR-PLAYER_H,'+1 od kibica','#60e473');sound('ding');burst(o.x,o.y,'#2ecc40');fanMood('cheer',1);}return;}
    if(o.kind==='trap'){score+=50;pop(o.x,o.y,'+50 (pułapka ominięta)','#8bff9d');sound('ding');burst(o.x,o.y,'#8bff9d');return;}
    damagePlayer(o.kind==='exam'?2:1,o);return;
  }
  if(o.kind==='5'){
    fives++;combo++;const gain=100+Math.min(combo-1,5)*20;score+=gain;pop(o.x,o.y,'+'+gain,'#60e473');player.green=.15;sound('ding');burst(o.x,o.y,'#2ecc40');
    if(fives>=LEVELS[level].target)finishLevel();
  }else{
    if(invulnerable>0)return;
    ones++;combo=0;pop(player.x,FLOOR-PLAYER_H,'TRAFIENIE','#ff7975');invulnerable=INVULNERABLE;player.red=.3;shake=.22;
    if(ones===2)announce('Zagrożenie! Jeszcze jedna jedynka i poprawka.');
    player.knock=(player.x>=o.x?1:-1)*450;sound('buzz');vibrate(ones===3?[80,60,160]:60);burst(o.x,o.y,'#e5322d');
    if(ones===3)failLevel('Trzy jedynki — czas na poprawkę.');
  }
}
function update(dt){
  for(const f of fx){f.life-=dt;if(f.kind==='marker'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=900*dt;f.rot+=9*dt;}}fx=fx.filter(f=>f.life>0);
  invulnerable=Math.max(0,invulnerable-dt);noticeTime=Math.max(0,noticeTime-dt);
  updatePlayer(dt);boost=Math.max(0,boost-dt);shake=Math.max(0,shake-dt);
  const old=Math.floor(elapsed);elapsed+=dt;score+=Math.floor(elapsed)-old;
  if(elapsed>=LEVELS[level].time&&!(level===4&&(duel.ending>0||boss.defeated))){failLevel(level===4?'Koniec czasu! Łukasz utrzymał argumenty — powtórka.':'Koniec czasu! Nie udało się zebrać wymaganych piątek.');return;}
  if(level>=3)updateBoss(dt);
  if(level>=1&&level<=3)updateTeacher(dt);
  if(examQueue>0){examIn-=dt;if(examIn<=0){spawn('exam',true);examQueue--;examIn+=0.55;}}
  spawnIn-=dt;boostIn-=dt;
  if(level!==4&&spawnIn<=0){spawn();spawnIn+=LEVELS[level].interval;}
  if(boostIn<=0){spawn('logo');boostIn+=level===4?DUEL.logoEvery:BOOST_EVERY;}
  if(level===4){updateFinal(dt);if(state!=='play')return;}
  for(let i=items.length-1;i>=0;i--){
    const o=items[i];
    // Sprawdzian czeka nieruchomo na końcu ostrzeżenia; nie ma jeszcze kolizji.
    if(o.warning>0){o.warning=Math.max(0,o.warning-dt);continue;}
    if(boost>0&&o.kind==='5'&&!o.reflected){
      const dx=player.x-o.x,dy=FLOOR-PLAYER_H/2-o.y,dist=Math.hypot(dx,dy);
      if(dist<MAGNET){const speed=650;o.vx=dx/Math.max(dist,1)*speed;o.vy=dy/Math.max(dist,1)*speed;}
    }
    if(o.thrown){o.trail=o.trail||[];o.trail.unshift({x:o.x,y:o.y});o.trail.length=Math.min(o.trail.length,8);o.age=(o.age||0)+dt;}
    if(o.homing){
      // Odbita jedynka leci do tułowia Łukasza i zabiera mu punkt argumentów.
      const t=bossTorso(),dx=t.x-o.x,dy=t.y-o.y,d=Math.hypot(dx,dy)||1;
      o.vx=dx/d*760;o.vy=dy/d*760;
      if(d<55){items.splice(i,1);if(!boss.defeated)bossHit(o);if(state!=='play')return;if(boss.defeated)break;continue;}
    }
    if(o.thrown&&!o.reflected)o.vy+=o.gravity*dt;
    o.x+=o.vx*dt;o.y+=o.vy*dt;
    const half=size(o).w/2;
    if(!o.thrown&&o.x<half){o.x=half;o.vx=Math.abs(o.vx);}
    if(!o.thrown&&o.x>W-half){o.x=W-half;o.vx=-Math.abs(o.vx);}
    if(!o.reflected&&collides(o)){
      if(boost>0&&(o.kind==='1'||o.kind==='exam')){
        o.reflected=true;o.vy=-420;o.vx=(o.x<player.x?-1:1)*260;sound('clang');
        if(level===4){o.homing=true;o.trail=[];pop(o.x,o.y,'TARCZA — ODBICIE');}
        burst(o.x,o.y,'#ffda62');
      }else{items.splice(i,1);collect(o);if(state!=='play')return;}
    }else if(o.kind==='5'&&o.y-size(o).h/2>FLOOR){
      // Piątka minęła stopy — odejmujemy postęp tylko raz, bez wartości ujemnych.
      if(!o.gift){fives=Math.max(0,fives-1);announce('Uciekła piątka! −1 do postępu klasy.');}
      items.splice(i,1);
    }else if(o.x<-150||o.x>W+150||o.y>H+120||(o.reflected&&!o.homing&&o.y<-120))items.splice(i,1);
  }
  for(const p of sparks){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;}
  sparks=sparks.filter(p=>p.life>0);
}

  ctx.fillStyle='#344054';ctx.fillRect(220,61,500,14);
  ctx.fillStyle='#ffda62';ctx.fillRect(220,61,500*boost/BOOST_TIME,14);
  text(boost>0?boost.toFixed(1)+' s':'Złap logo szkoły',745,69,17,'#c8d5e8','left');
  text(level===4?'RZUT: piątka do ucznia z napisem CEL':'Seria: '+combo+' · następna 5: +'+(100+Math.min(combo,5)*20),920,70,15,'#7ced8b','left');
  panel(pauseBox.x,pauseBox.y,pauseBox.w,pauseBox.h);text('Ⅱ',1141,41,27);
}
function button(label,y=600){panel(390,y-28,500,56,'#d7b14d');text(label,W/2,y,24,'#101b30');}

// UI — menu pozostaje czytelne także wtedy, gdy brakuje wszystkich grafik.
function drawUI(){
  if(state==='play'){
    drawHUD();
    panel(14,654,320,50);
    text('Czas: '+Math.max(0,Math.ceil(LEVELS[level].time-elapsed))+' s',174,679,23,LEVELS[level].time-elapsed<=10?'#ff7975':'#ffda62');
    if(level===4){
      if(elapsed<8)text('Odbijaj jedynki, gdy są w pierścieniu · uskakuj przed sprawdzianem',670,680,17,'#ffda62');
      panel(fireBox.x,fireBox.y,fireBox.w,fireBox.h,firePointers.size?'#307940':'#1c5930');
      text('ODBIJ · SPACJA',1135,669,23,'#fff');
    }
    if(noticeTime>0){panel(300,102,680,44);text(notice,640,124,21,'#ffda62');}
    if(paused){panel(290,240,700,230);text('PAUZA',640,300,48,'#ffda62');text('P / Enter / dotknij, aby wrócić',640,370,25);}

    ctx.fillStyle='rgba(4,12,28,.78)';ctx.fillRect(0,0,W,H);

      logo(640,36,104);text('RUSZKOWSKI: ZDAJ ALBO POWTARZAJ',640,185,42,'#ffda62');
      text('Dzień Programisty 2026 · ZSZ im. Jana Ruszkowskiego w Pułtusku',640,238,23);
      panel(250,292,780,204);
      text('Zbieraj zielone 5 — osiągnij cel przed końcem czasu.',640,338,25,'#7ced8b');
      text('Unikaj czerwonych 1 — trzy jedynki to powtórka.',640,393,25,'#ff9690');
      text('Logo = 3 s tarczy · przepuszczona piątka: −1.',640,448,25,'#ffda62');
      text('Pięć klas — w finale pojedynek z Łukaszem',640,525,24,'#ffda62');
      text('Piątki w serii: +100 do +200 pkt · jedynka zeruje serię',640,558,18,'#c3d0e2');
      button('Naciśnij Enter / dotknij ekranu');
      text('← → lub A/D: ruch · P: pauza · R: restart · M: dźwięk',640,664,20,'#c3d0e2');
    }else if(state==='difficulty'){
      text('Wybierz trudność',640,140,46,'#ffda62');
      text('← → i Enter lub dotknij wybranej karty',640,205,24);
      difficultyCards.forEach((r,i)=>{
        const d=DIFFICULTIES[i];
        panel(r.x,r.y,r.w,r.h,i===difficulty?'#34466c':'#14233d');
        ctx.strokeStyle=i===difficulty?'#ffda62':'#697995';ctx.lineWidth=4;ctx.strokeRect(r.x,r.y,r.w,r.h);
        text(d.name,r.x+r.w/2,r.y+48,34,i===difficulty?'#ffda62':'#fff');
        text('Klasy 1–4: '+d.targets.slice(0,4).join(' / '),r.x+r.w/2,r.y+102,17);
        text('Finał: '+DUEL.hp[i]+' vs '+DUEL.bossHp[i]+' argumentów',r.x+r.w/2,r.y+134,20);
        text('Czas finału: '+d.times[4]+' s',r.x+r.w/2,r.y+169,18);
        text(['Wolniej, więcej piątek','Wyważone tempo','Szybciej, dłuższe serie'][i],r.x+r.w/2,r.y+208,19,'#cbd7e7');
      });text('Pięć klas · Damian pomaga · Łukasz w każdym trybie',640,560,21,'#ffda62');button('Enter — dalej',610);
    }else if(state==='character'){
      text('Kim grasz w klasach 1–4?',640,110,44,'#ffda62');
      text('← → i Enter lub dotknij karty · w finale ta postać kibicuje Damianowi',640,160,21);
      characterCards.forEach((r,i)=>{
        const name=i?'uczennica':'uczen',on=hero===name;
        panel(r.x,r.y,r.w,r.h,on?'#34466c':'#14233d');
        ctx.strokeStyle=on?'#ffda62':'#697995';ctx.lineWidth=4;ctx.strokeRect(r.x,r.y,r.w,r.h);
        ctx.save();ctx.translate(r.x+r.w/2,r.y+270);if(on)ctx.scale(1.05+0.02*Math.sin(clock*5),1.05+0.02*Math.sin(clock*5));
        picture(name,-120,-240,240,240);ctx.restore();
        text(i?'Uczennica':'Uczeń',r.x+r.w/2,r.y+320,32,on?'#ffda62':'#fff');

      button('Enter — zaczynamy',620);
    }else if(state==='briefing'){
      const final=level===4;
      text(final?'Klasa 5 — Rada pedagogiczna':'Klasa '+(level+1),640,132,42,'#ffda62');
      picture(final?'damian':hero,160,235,250,250);
      text(final?'Grasz Damianem — nauczycielem':(fem()?'Grasz uczennicą':'Grasz uczniem'),815,250,29);
      const lines=final?
        ['Rada pedagogiczna: Ty kontra Łukasz, pasek na pasek.',
         'Jedynkę odbij piątką, gdy jest blisko — wraca do niego.',
         'Sprawdzianu nie odbijesz: uskocz. Pułapki nie ruszaj.',
         'Seria odbić ×2, ×3. Kibic w kryzysie rzuci Ci piątkę.']:
        ['Zbieraj piątki i unikaj jedynek.',
         'Damian pomaga: patroluje i rzuca Ci piątki.',
         level===3?'Łukasz celuje w Ciebie — unikaj jego rzutów.':'Trzy jedynki oznaczają powtórkę klasy.',
         'Piątki od Damiana nie karzą za nieudany chwyt.'];
      lines.forEach((line,i)=>text(line,815,315+i*44,21,'#d2dfed'));
      if(final){
        // Legenda pocisków: odbij / uskocz / nie odbijaj.
        [['1','#e5322d','ODBIJ','#8bff9d'],['SPR.','#fff','USKOCZ','#fff'],['5','#2ecc40','NIE ODBIJAJ','#ff7975']].forEach(([g,c,l,lc],i)=>{
          const x=440+i*200;panel(x-70,478,140,64,'rgba(9,19,39,.8)');
          ctx.font='900 34px Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=i===2?6:3;ctx.strokeStyle=i===2?'#e5322d':'#fff';ctx.strokeText(g,x,498);ctx.fillStyle=c;ctx.fillText(g,x,498);
          text(l,x,528,14,lc);
        });
      }
      text(final?'Cel: wyzeruj '+DUEL.bossHp[difficulty]+' argumentów Łukasza w '+LEVELS[level].time+' s':
        'Cel: '+LEVELS[level].target+' piątek w '+LEVELS[level].time+' s',640,final?570:550,26,'#ffda62');
      button('Enter / dotknij — zaczynamy',620);
    }else if(state==='win'){
      panel(220,95,840,540,'rgba(248,242,220,.97)');logo(640,115,75);
      text(fem()?'ZDAŁAŚ!':'ZDAŁEŚ!',640,242,55,'#162743');
      text('Pięć klas — misja ukończona!',640,306,35,'#162743');
      text('Świadectwo z wyróżnieniem · ZSZ w Pułtusku',640,360,24,'#44506a');
      if(retried)text('Poprawka zaliczona!',640,395,22,'#317844');
      text('Wynik: '+score,640,435,34,'#162743');
      text('Rekord ('+DIFFICULTIES[difficulty].name+'): '+best,640,488,25,'#44506a');button('Od nowa',570);
    }else{
      panel(200,215,880,320);
      text(state==='repeat'?'Powtarzasz klasę!':(fem()?'Zdałaś! ':'Zdałeś! ')+'Promocja do klasy '+(level+2),640,280,42,state==='repeat'?'#ff8d85':'#81eb91');
      if(state==='promotion'&&retried)text('Poprawka zaliczona!',640,318,21,'#ffda62');
      text('Wynik: '+score,640,350,31);
      text(state==='repeat'?failure:ones===0?'Bez jedynki! Premia +500 punktów.':'Kolejna klasa czeka.',640,412,23,'#cbd7e7');
      button('Enter / dotknij — dalej',490);
    }
  }
  panel(muteBox.x,muteBox.y,muteBox.w,muteBox.h);
  text(muted?'M ×':'M ♪',1226,41,22,muted?'#ff9690':'#ffda62');
}
function render(){
  ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0&&state==='play'&&!paused)ctx.translate((Math.random()-.5)*12,(Math.random()-.5)*12);
  background();
  if(state==='play'){
    if(level===4)drawFan();
    if(level>=3)drawBoss();
    if(level>=1&&level<=3)drawTeacher();
    if(level===4)drawFinal();
    items.forEach(drawItem);drawPlayer();drawEffects();
    for(const p of sparks){ctx.globalAlpha=p.life/.5;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,5,5);}ctx.globalAlpha=1;
  }
  ctx.restore();drawUI();
}
let last=0;
function frame(now){
  const dt=last?Math.min((now-last)/1000,.05):0;last=now;menuAge+=dt;
  if(state==='play'&&level===4&&duel.freeze>0&&!paused){duel.freeze-=dt;render();requestAnimationFrame(frame);return;}
  if(!paused){clock+=dt;if(state==='play')update(dt);}
  render();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
